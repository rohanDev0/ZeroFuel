name: ZeroFuel Production

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Production version"
        required: true
        default: "4.2.4"
        type: string

      version_code:
        description: "Android version code (must exceed previous production releases)"
        required: true
        type: string

      publish_release:
        description: "Publish GitHub Release after verification"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: zerofuel-production-release
  cancel-in-progress: false

jobs:
  production-release:
    name: Build and verify production APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Validate release inputs
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid stable version name."
            exit 1
          fi

          if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "Version code must be a positive integer."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin \
            "refs/tags/v${VERSION_NAME}" >/dev/null 2>&1; then
            echo "This release tag already exists."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Install Android dependencies
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKM" --licenses || true

          "$SDKM" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore production signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ZERO_FUEL_KEYSTORE_BASE64 }}
          EXPECTED_SHA256: ${{ secrets.ZERO_FUEL_KEYSTORE_SHA256 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$EXPECTED_SHA256"

          echo "$KEYSTORE_BASE64" | base64 --decode > zerofuel-release.jks

          ACTUAL_SHA256=$(sha256sum zerofuel-release.jks | awk '{print $1}')
          EXPECTED_SHA256=$(echo "$EXPECTED_SHA256" | tr '[:upper:]' '[:lower:]')

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "Production keystore checksum mismatch."
            exit 1
          fi

      - name: Configure signing
        env:
          STORE_PASSWORD: ${{ secrets.ZERO_FUEL_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZERO_FUEL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ZERO_FUEL_KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          cat > keystore.properties <<EOF
          storeFile=zerofuel-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Configure local properties
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
        run: |
          {
            echo "LASTFM_API_KEY=$LASTFM_API_KEY"
            echo "LASTFM_SECRET=$LASTFM_SECRET"
            echo "LISTEN_TOGETHER_SERVER=$LISTEN_TOGETHER_SERVER"
            echo "UPDATE_REPO=$GITHUB_REPOSITORY"
          } > local.properties

      - name: Build optimized production APK
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          chmod +x gradlew

          ./gradlew :app:assembleProdRelease \
            -Pversion_name="$VERSION_NAME" \
            -Pversion_code="$VERSION_CODE" \
            --build-cache \
            --stacktrace

      - name: Verify production APK
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          APK=$(find app/build/outputs/apk/prod/release \
            -maxdepth 1 -type f -name '*.apk' \
            ! -name '*unsigned*' | head -n 1)

          test -n "$APK"
          test -s "$APK"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)

          AAPT=$(find "$ANDROID_HOME/build-tools" \
            -type f -name aapt | sort -V | tail -n 1)

          test -n "$APKSIGNER"
          test -n "$AAPT"

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          BADGING=$("$AAPT" dump badging "$APK")

          echo "$BADGING" | grep -F \
            "package: name='com.zerofuel.music'"

          echo "$BADGING" | grep -F "versionCode='$VERSION_CODE'"
          echo "$BADGING" | grep -F "versionName='$VERSION_NAME'"

          mkdir -p release-output

          cp "$APK" \
            "release-output/ZeroFuel-${VERSION_NAME}.apk"

          sha256sum "release-output/ZeroFuel-${VERSION_NAME}.apk" \
            > release-output/SHA256SUMS.txt

      - name: Upload verified production APK
        uses: actions/upload-artifact@v4
        with:
          name: ZeroFuel-Production-${{ inputs.version_name }}
          path: release-output/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}
          name: ZeroFuel v${{ inputs.version_name }}
          generate_release_notes: true
          files: release-output/ZeroFuel-${{ inputs.version_name }}.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
