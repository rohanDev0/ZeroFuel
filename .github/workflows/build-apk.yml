name: ZeroFuel Production Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android dependencies
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses || true
          "$SDKM" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ZERO_FUEL_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ZERO_FUEL_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZERO_FUEL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ZERO_FUEL_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > zerofuel-release.jks
          chmod 600 zerofuel-release.jks
          {
            echo "storeFile=zerofuel-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

        - name: Validate release keystore
        env:
          STORE_PASSWORD: ${{ secrets.ZERO_FUEL_STORE_PASSWORD }}
        run: |
          echo "Checking reconstructed keystore..."
          keytool -list -keystore zerofuel-release.jks -storepass "$STORE_PASSWORD"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Production APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleProdRelease --stacktrace

      - name: Upload Production APK
        uses: actions/upload-artifact@v4
        with:
          name: ZeroFuel-Production-APK
          path: app/build/outputs/apk/prod/release/*.apk
          if-no-files-found: error
          retention-days: 30
