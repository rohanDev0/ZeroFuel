name: ZeroFuel Production APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-prod-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Android Dependencies
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses || true
          "$SDKM" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Setup local.properties
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
        run: |
          touch local.properties
          {
            echo "LASTFM_API_KEY=$LASTFM_API_KEY"
            echo "LASTFM_SECRET=$LASTFM_SECRET"
            echo "LISTEN_TOGETHER_SERVER=$LISTEN_TOGETHER_SERVER"
          } > local.properties

      - name: Prepare Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ZERO_FUEL_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ZERO_FUEL_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZERO_FUEL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ZERO_FUEL_KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ZERO_FUEL_KEYSTORE_BASE64 is missing"
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > zerofuel-release.jks
          chmod 600 zerofuel-release.jks

          if [ ! -s zerofuel-release.jks ]; then
            echo "::error::Decoded keystore is empty"
            exit 1
          fi

          echo "Checking reconstructed keystore..."

          keytool -list \
            -keystore zerofuel-release.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS"

          {
            echo "storeFile=zerofuel-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build Signed Production APK
        run: |
          ./gradlew :app:assembleProdRelease \
            --parallel \
            --build-cache \
            --stacktrace

      - name: Upload Production APK
        uses: actions/upload-artifact@v4
        with:
          name: ZeroFuel-Production-APK
          path: app/build/outputs/apk/prod/release/*.apk
          if-no-files-found: error
          retention-days: 30
